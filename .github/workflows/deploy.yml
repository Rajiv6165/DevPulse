name: DevPulse CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Install SDK in Editable Mode
        run: |
          pip install -e ./devpulse-sdk

      - name: Run Pytest
        env:
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "dummykey"
          SUPABASE_DB_URL: "postgresql://postgres:pass@localhost:5432/postgres"
          UPSTASH_REDIS_REST_URL: "https://example.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "dummytoken"
          JWT_SECRET_KEY: "secretfortestingonly"
        run: |
          export PYTHONPATH=backend
          pytest backend/tests/
          pytest devpulse-sdk/tests/

  lint:
    name: Code Quality Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Backend Linter
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check backend/

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint Check
        working-directory: ./frontend
        run: npm run lint

  deploy-backend:
    name: Deploy Backend to AWS EC2
    needs: [test, lint]
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/DevPulse
            
            # 1. Backup the currently running backend image
            # Try tagging both devpulse-backend and devpulse_backend
            docker tag devpulse-backend:latest devpulse-backend:backup || true
            docker tag devpulse_backend:latest devpulse_backend:backup || true
            
            # 2. Pull the latest code and build/start the new backend container
            git pull origin main
            docker compose -f docker-compose.yml up -d --build backend
            
            # 3. Monitor health status of the new backend container for up to 30 seconds
            echo "Monitoring health check of the new backend deployment..."
            HEALTH_OK=false
            for i in {1..30}; do
              CONTAINER_ID=$(docker compose ps -q backend)
              if [ -z "$CONTAINER_ID" ]; then
                echo "Error: Backend container is not running."
                break
              fi
              
              STATUS=$(docker inspect --format='{{json .State.Health.Status}}' "$CONTAINER_ID" 2>/dev/null || echo "starting")
              STATUS=${STATUS//\"/}
              
              if [ "$STATUS" = "healthy" ]; then
                echo "New backend container is healthy!"
                HEALTH_OK=true
                break
              elif [ "$STATUS" = "unhealthy" ]; then
                echo "Error: Container health check reports UNHEALTHY."
                break
              else
                echo "Container status is: $STATUS... waiting ($i/30s)"
                sleep 1
              fi
            done
            
            # 4. Rollback if the health check failed
            if [ "$HEALTH_OK" = "false" ]; then
              echo "WARNING: Health check failed! Initiating rollback..."
              docker compose stop backend || true
              
              # Revert backend image tag back to backup
              if docker image inspect devpulse-backend:backup >/dev/null 2>&1; then
                docker tag devpulse-backend:backup devpulse-backend:latest
                docker compose up -d --no-deps backend
                echo "Successfully rolled back to previous devpulse-backend image."
              elif docker image inspect devpulse_backend:backup >/dev/null 2>&1; then
                docker tag devpulse_backend:backup devpulse_backend:latest
                docker compose up -d --no-deps backend
                echo "Successfully rolled back to previous devpulse_backend image."
              else
                echo "Error: No backup image available to roll back to."
              fi
              exit 1
            fi
            
            # 5. Build/run everything else (frontend) and clean up
            docker compose -f docker-compose.yml up -d --build frontend
            docker image prune -f

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [test, lint]
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Trigger Vercel Deployment via API
        run: |
          curl -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "devpulse",
              "projectId": "${{ secrets.VERCEL_PROJECT_ID }}"
            }' \
            --fail
