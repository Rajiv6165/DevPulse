name: DevPulse CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run Pytest
        env:
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "dummykey"
          SUPABASE_DB_URL: "postgresql://postgres:pass@localhost:5432/postgres"
          UPSTASH_REDIS_REST_URL: "https://example.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "dummytoken"
          JWT_SECRET_KEY: "secretfortestingonly"
        run: |
          export PYTHONPATH=backend
          pytest backend/tests/

  lint:
    name: Code Quality Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Backend Linter
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check backend/

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint Check
        working-directory: ./frontend
        run: npm run lint

  deploy-backend:
    name: Deploy Backend to AWS EC2
    needs: [test, lint]
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/DevPulse
            git pull origin main
            docker compose -f docker-compose.yml up -d --build
            docker image prune -f

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [test, lint]
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Trigger Vercel Deployment via API
        run: |
          curl -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "devpulse",
              "projectId": "${{ secrets.VERCEL_PROJECT_ID }}"
            }' \
            --fail
